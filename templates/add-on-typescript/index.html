<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>__TITLE__</title>
  <style>
    :root { color-scheme: dark; --accent: #F7C449; }
    body { margin: 0; background: #151515; color: #ddd; font: 14px -apple-system, Helvetica, sans-serif; display: flex; flex-direction: column; height: 100vh; }
    header { display: flex; align-items: center; gap: 12px; padding: 10px 14px; background: #222; border-bottom: 1px solid #333; }
    header button { font: inherit; background: #2a2a2a; color: #ddd; border: 1px solid #444; border-radius: 6px; padding: 6px 14px; cursor: pointer; }
    header button.on { background: var(--accent); color: #000; }
    #location { font: 600 22px Menlo, monospace; color: var(--accent); }
    #status { margin-left: auto; color: #888; }
    main { flex: 1; overflow: auto; padding: 12px 14px; }
    .track { display: flex; align-items: center; gap: 10px; padding: 6px 0; border-bottom: 1px solid #262626; }
    .track .name { flex: 1; }
    .track button { font: 11px -apple-system, Helvetica; width: 28px; height: 22px; background: #2a2a2a; color: #ccc; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
    .track button.on { background: var(--accent); color: #000; }
    .track .gain { color: #999; font-family: Menlo, monospace; min-width: 60px; text-align: right; }
  </style>
</head>
<body>
  <header>
    <button id="play">Play</button>
    <button id="stop">Stop</button>
    <div id="location">-|-|---</div>
    <div id="status">connecting...</div>
  </header>
  <main id="tracks"></main>
  <script src="vendor/luna.global.js"></script>
  <!-- The bundle npm run build writes from src/: one classic script, never a module script. -->
  <script src="dist/main.js"></script>
</body>
</html>

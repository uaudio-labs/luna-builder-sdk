<!doctype html>
<meta charset="utf-8">
<title>MAIN mute</title>
<!--
  The canonical minimal LUNA Add On: one button bound to the master bus mute, on the model
  layer. Luna.connect() reads the ?port= LUNA appends; session.master finds MAIN by bus type;
  mute.toggle() is optimistic and reconciled from the engine, so the button follows LUNA
  when the user mutes there.

  This file loads the SDK build by a relative path (see the script tag) so it runs from
  where it sits. To install it as an Add On, make the folder self-contained: copy the build
  next to this file and change the src to ./luna.global.js, then follow the create-add-on
  skill. This example shows the connection-lifecycle patterns (offline, no session,
  disconnect, session switch); mixer.html shows the control patterns.
-->
<script src="../../dist/luna.global.js"></script>
<style>
  :root { color-scheme: dark; }
  body { font-family: -apple-system, system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; gap: 1rem; background: #1b1b1e; color: #eee; }
  #label { font-size: .9rem; opacity: .7; letter-spacing: .05em; text-transform: uppercase; }
  button#mute { font-size: 1.5rem; font-weight: 600; padding: 1.5rem 3rem; border-radius: .75rem; border: 3px solid #555; background: #2c2c31; color: #eee; cursor: pointer; }
  button#mute[data-muted="true"] { background: #7a1c1c; border-color: #ff4d4d; color: #fff; }
  button#mute:disabled { opacity: .5; cursor: default; }
  #status { font-size: .85rem; opacity: .6; min-height: 1.2em; }
  #status.error { color: #ff8080; opacity: 1; }
</style>
<div id="label">MAIN</div>
<button id="mute" disabled>connecting…</button>
<div id="status"></div>
<script>
(async () => {
  const button = document.getElementById('mute');
  const status = document.getElementById('status');
  const say = (text, err = false) => { status.textContent = text; status.classList.toggle('error', err); };
  const render = (muted) => { button.dataset.muted = String(muted); button.textContent = muted ? 'MUTED' : 'UNMUTED'; };

  let luna;
  try { luna = await Luna.connect(); }                            // honours ?port= from LUNA
  catch (e) { say(e.message, true); button.textContent = 'offline'; return; }
  Luna.bindShortcuts(luna);                                       // LUNA's undo, redo, play and record keys
  let bound = false;                                            // a control is wired to the button
  let offMute = () => {};                                       // the mute listener's unsubscribe
  luna.status.onChange(() => {
    const connected = luna.status.value === 'connected';
    button.disabled = !connected || !bound;
    say(connected ? '' : 'disconnected from LUNA', !connected);
  });

  async function bind() {
    offMute(); bound = false;                                   // release before rebinding, or listeners stack
    const session = luna.sessions.current();
    if (!session) { say('no session open in LUNA', true); button.textContent = 'no session'; button.disabled = true; return; }
    await session.ready();
    const main = session.master;
    if (!main) { say('this session has no master bus', true); return; }
    await main.loadStrip();
    document.getElementById('label').textContent = main.name.value;
    render(main.mute.on);
    offMute = main.mute.real.onChange(() => render(main.mute.on));   // follows LUNA's own mute button
    button.onclick = () => main.mute.toggle().catch((e) => say(e.message, true));
    bound = true;
    button.disabled = false;
    say('');
  }
  await luna.sessions.ready();
  await bind();
  luna.sessions.focused.onChange(bind);                         // user switched sessions
  luna.sessions.items.onChange(bind);
})();
</script>
